services:
  mysql:
    image: mysql:8.0
    container_name: sdit-rohum-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sdit_rohum
      MYSQL_USER: sdit_user
      MYSQL_PASSWORD: sdit_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - sdit-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    build: .
    container_name: sdit-rohum-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_USER: sdit_user
      DB_PASSWORD: sdit_password
      DB_NAME: sdit_rohum
      JWT_SECRET: your_super_secret_key_change_this_in_production
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sdit-network

volumes:
  mysql_data:

networks:
  sdit-network:
    driver: bridge
